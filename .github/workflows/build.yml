name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  XO_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  quality:
    name: Format, lint, and test
    # Keep untrusted pull requests on ephemeral GitHub runners. Trusted branch
    # and tag builds use any available persistent Linux project runner and its warm caches.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run quick workspace tests
        run: |
          cargo test --workspace --locked -- \
            --skip three_persisted_peers_converge_after_isolated_edits_and_restarts \
            --skip extensive_thousand_item_workspace_rebuilds_and_resolves

      - name: Test live Hardcover search
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          if [[ -z "${HARDCOVER_TOKEN}" ]]; then
            echo 'HARDCOVER_TOKEN is unavailable; live Hardcover integration test is intentionally skipped.'
          else
            cargo test -p xo steel_plugin::tests::hardcover_live_search_uses_configured_token \
              --locked -- --ignored --exact --nocapture
          fi

  extensive:
    name: Extensive release tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: extensive-release

      - name: Run 1000-item knowledge-base test
        run: |
          cargo test -p xo-core --features test-utils --lib \
            extensive_thousand_item_workspace_rebuilds_and_resolves \
            --locked -- --ignored --test-threads=1

      - name: Run local relay-backed three-peer replication test
        run: |
          cargo test -p xo-core --features test-utils --lib \
            three_persisted_peers_converge_after_isolated_edits_and_restarts \
            --locked -- --test-threads=1

  web:
    name: xo-pwa static PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate streamed installer entry point
        run: |
          bash -n install.sh
          bash -c 'source install.sh'
          output="$(sed 's/^  main "$@"$/  echo streamed-main-ran/' install.sh | bash)"
          test "${output}" = streamed-main-ran

      - name: Install Rust 1.89 with Wasm target
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: xo-pwa-wasm

      - name: Verify Wasm C compiler
        run: clang --version

      - name: Cache wasm-pack
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit

      - name: Build Rust WebAssembly facade
        working-directory: web
        run: npm run build:wasm

      - name: Typecheck and build static PWA
        working-directory: web
        run: npm run build

      - name: Smoke-test static routes
        working-directory: web
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/xo-pwa-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill ${preview_pid}' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/client/route | grep -q '<title>xo</title>'
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest | grep -q '"name":"xo"'
          curl --fail --silent http://127.0.0.1:4173/version.json | grep -q "\"version\":\"${XO_VERSION}\""

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium and Firefox
        working-directory: web
        # GitHub's Ubuntu image already contains browser runtime libraries. WebKit
        # remains an opt-in local project because installing its 181 host packages
        # depends on an external apt mirror that is not reliable in commit CI.
        run: npx playwright install chromium firefox

      - name: Test browser central synchronization and offline recovery
        shell: bash
        run: |
          set -euo pipefail
          XO_PWA_DIR="${PWD}/web/dist" cargo build --locked -p xo-syncd -p xo
          state=$(mktemp -d)
          target/debug/xo-syncd --state-dir "${state}" --bind 127.0.0.1:19464 \
            > /tmp/xo-syncd-browser.log 2>&1 &
          server_pid=$!
          trap 'kill -INT ${server_pid} 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19464/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:19464/healthz > /dev/null
          fixture=$(mktemp -d)
          mkdir -p "${fixture}/home/.config/xo" "${fixture}/source"
          HOME="${fixture}/home" target/debug/xo config-init \
            > "${fixture}/home/.config/xo/config.scm"
          cat > "${fixture}/source/native.md" <<'EOF'
          ---
          id: natvbrw
          type: note
          title: Native browser fixture
          tags: []
          created: 2026-01-01T00:00:00Z
          ---
          synchronized from the native client through xo-syncd
          EOF
          HOME="${fixture}/home" target/debug/xo \
            --state-dir "${fixture}/native-state" \
            --projection "${fixture}/projection" \
            --client-id native-fixture \
            --server http://127.0.0.1:19464 \
            import "${fixture}/source"
          python3 web/tests/tui-driver.py \
            --port 19465 \
            --log "${fixture}/tui.log" \
            --ready-text "Native browser fixture" \
            -- env HOME="${fixture}/home" target/debug/xo \
              --state-dir "${fixture}/native-state" \
              --projection "${fixture}/projection" \
              --client-id native-fixture \
              --server http://127.0.0.1:19464 &
          tui_pid=$!
          trap 'kill ${tui_pid} 2>/dev/null || true; kill -INT ${server_pid} 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19465/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:19465/healthz > /dev/null
          cd web
          XO_WEB_BASE_URL=http://127.0.0.1:19464 XO_NATIVE_FIXTURE=1 npx playwright test --project=chromium
          XO_WEB_BASE_URL=http://127.0.0.1:19464 npx playwright test --project=firefox \
            --grep 'restores the durable|prevents mobile'
          XO_WEB_BASE_URL=http://127.0.0.1:19464 npx playwright test --project=mobile-chromium \
            --grep 'prevents mobile'

      - name: Package static PWA
        run: tar -C web/dist -czf xo-pwa.tar.gz .

      - name: Upload static PWA
        uses: actions/upload-artifact@v7
        with:
          name: xo-pwa
          path: xo-pwa.tar.gz
          if-no-files-found: error

  binaries:
    name: Binaries (${{ matrix.target }})
    needs:
      - quality
      - web
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && matrix.pull_request_runner || matrix.trusted_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - trusted_runner: '["ubuntu-24.04"]'
            pull_request_runner: '["ubuntu-24.04"]'
            target: x86_64-unknown-linux-gnu
            package: xo-x86_64-unknown-linux-gnu.tar.gz
          - trusted_runner: '["self-hosted","Linux","ARM64"]'
            pull_request_runner: '["ubuntu-24.04-arm"]'
            target: aarch64-unknown-linux-gnu
            package: xo-aarch64-unknown-linux-gnu.tar.gz
          - trusted_runner: '["macos-15"]'
            pull_request_runner: '["macos-15"]'
            target: aarch64-apple-darwin
            package: xo-aarch64-apple-darwin.tar.gz
          - trusted_runner: '["windows-2025"]'
            pull_request_runner: '["windows-2025"]'
            target: x86_64-pc-windows-msvc
            package: xo-x86_64-pc-windows-msvc.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download production PWA
        uses: actions/download-artifact@v8
        with:
          name: xo-pwa
          path: pwa-artifact

      - name: Prepare embedded production PWA
        shell: bash
        run: |
          mkdir -p crates/xo-syncd/pwa-dist
          tar -C crates/xo-syncd/pwa-dist -xzf pwa-artifact/xo-pwa.tar.gz
          test -f crates/xo-syncd/pwa-dist/index.html
          test -f crates/xo-syncd/pwa-dist/sw.js
          test -f crates/xo-syncd/pwa-dist/manifest.webmanifest

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries with embedded PWA
        env:
          XO_PWA_DIR: ${{ github.workspace }}/crates/xo-syncd/pwa-dist
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Verify embedded release version
        shell: bash
        run: |
          extension=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extension=".exe"
          fi
          for binary in xo xo-lsp xo-syncd; do
            "target/${{ matrix.target }}/release/${binary}${extension}" --version | grep -F "${XO_VERSION}"
          done

      - name: Smoke-test embedded PWA
        if: runner.os == 'Linux'
        shell: bash
        run: |
          state=$(mktemp -d)
          binary="target/${{ matrix.target }}/release/xo-syncd"
          "${binary}" --state-dir "${state}" --bind 127.0.0.1:19466 > /tmp/xo-syncd-embedded.log 2>&1 &
          pid=$!
          trap 'kill ${pid} 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:19466/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:19466/manifest.webmanifest | grep -F '"name":"xo"'
          curl --fail --silent http://127.0.0.1:19466/client/route | grep -F '<title>xo</title>'
          curl --fail --silent --dump-header /tmp/xo-pwa-headers \
            http://127.0.0.1:19466/sw.js > /dev/null
          grep -i '^cache-control: no-cache' /tmp/xo-pwa-headers

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xo dist/
          cp target/${{ matrix.target }}/release/xo-lsp dist/
          cp target/${{ matrix.target }}/release/xo-syncd dist/
          tar -C dist -czf "xo-${{ matrix.target }}.tar.gz" \
            xo xo-lsp xo-syncd

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/xo.exe dist/
          Copy-Item target/${{ matrix.target }}/release/xo-lsp.exe dist/
          Copy-Item target/${{ matrix.target }}/release/xo-syncd.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "xo-${{ matrix.target }}.zip"

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: xo-${{ matrix.target }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  container:
    name: xo-syncd container
    needs:
      - quality
      - binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: xo-*-unknown-linux-gnu
          path: container-binaries

      - name: Prepare container binaries
        shell: bash
        run: |
          mkdir -p container-dist/amd64 container-dist/arm64
          tar -xzf container-binaries/xo-x86_64-unknown-linux-gnu/xo-x86_64-unknown-linux-gnu.tar.gz \
            -C container-dist/amd64 xo-syncd
          tar -xzf container-binaries/xo-aarch64-unknown-linux-gnu/xo-aarch64-unknown-linux-gnu.tar.gz \
            -C container-dist/arm64 xo-syncd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=xo-syncd
            org.opencontainers.image.description=Always-on synchronization peer for xo workspaces

      - name: Build and publish xo-syncd image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - binaries
      - extensive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate timestamp release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "release tag must be a UTC timestamp such as 20260731T171136Z" >&2
            exit 1
          fi

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: xo-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum xo-* > SHA256SUMS

      - name: Create tagged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it unchanged."
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
