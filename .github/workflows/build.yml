name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  XO_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked -- --skip three_persisted_peers_converge_after_isolated_edits_and_restarts

      - name: Run local relay-backed three-peer sync test
        run: cargo test -p xo-core --features test-utils --lib three_persisted_peers_converge_after_isolated_edits_and_restarts --locked -- --test-threads=1

  web:
    name: xo-web static PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.89 with Wasm target
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: xo-web-wasm

      - name: Install Wasm C compiler
        run: sudo apt-get update && sudo apt-get install --yes clang

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit

      - name: Build Rust WebAssembly facade
        working-directory: web
        run: npm run build:wasm

      - name: Typecheck and build static PWA
        working-directory: web
        run: npm run build

      - name: Smoke-test static routes
        working-directory: web
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/xo-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill ${preview_pid}' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/client/route | grep -q '<title>xo</title>'
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest | grep -q '"name":"xo"'
          curl --fail --silent http://127.0.0.1:4173/version.json | grep -q "\"version\":\"${XO_VERSION}\""

      - name: Install Chromium, Firefox, and WebKit
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser Iroh convergence and offline recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p xo-admin -p xo-syncd
          fixture=$(mktemp -d)
          mkdir -p "${fixture}/source"
          cat > "${fixture}/source/fixture.md" <<'EOF'
          ---
          id: abcdefg
          type: note
          title: Browser fixture
          tags: []
          created: 2026-01-01T00:00:00Z
          ---
          Browser fixture created by a native peer.
          EOF
          cat > "${fixture}/source/reading.md" <<'EOF'
          ---
          id: bkabcde
          type: book
          title: TUI Reading Fixture
          tags: [reading]
          created: 2026-01-02T00:00:00Z
          ---
          Reading item created by a native TUI peer.
          EOF
          cat > "${fixture}/source/finished.md" <<'EOF'
          ---
          id: bkabcdf
          type: book
          title: TUI Finished Fixture
          tags: [finished]
          created: 2026-01-03T00:00:00Z
          ---
          Finished item created by a native TUI peer.
          EOF
          cat > "${fixture}/source/xo.scm" <<'EOF'
          (workspace-config
            (schema 1)
            (default-view "library")
            (query-limit 500)
            (views
              (view
                (id "library")
                (name "Library")
                (key #f)
                (show-tags #t)
                (title-field "title")
                (subtitle-field "type")
                (sort-field "title")
                (descending #f)
                (preview #f)
                (predicate (field-equals "type" "book"))
                (subviews
                  (subview
                    (id "reading")
                    (name "Reading")
                    (predicate (has-tag "reading")))))
              (view
                (id "notes")
                (name "Notes")
                (key #f)
                (show-tags #t)
                (title-field "title")
                (subtitle-field "type")
                (sort-field "title")
                (descending #f)
                (preview #f)
                (predicate (field-equals "type" "note"))
                (subviews)))
            (actions)
            (templates)
            (capability-grants))
          EOF
          target/debug/xo-admin import-workspace \
            "${fixture}/source" "${fixture}/state" > "${fixture}/import.out"
          ticket=$(grep '^ticket=' "${fixture}/import.out" | cut -d= -f2-)
          target/debug/xo-syncd \
            --state-dir "${fixture}/state" \
            --operator-bind 127.0.0.1:19464 > "${fixture}/syncd.log" 2>&1 &
          syncd_pid=$!
          trap 'kill ${syncd_pid} 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19464/healthz > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:19464/healthz > /dev/null
          cd web
          XO_IROH_TICKET="${ticket}" npm run test:e2e
          XO_IROH_TICKET="${ticket}" npx playwright test \
            --project=firefox --project=mobile-webkit \
            --grep 'creates a local item|prevents mobile|receives native items'

      - name: Package static PWA
        run: tar -C web/dist -czf xo-web.tar.gz .

      - name: Upload static PWA
        uses: actions/upload-artifact@v7
        with:
          name: xo-web
          path: xo-web.tar.gz
          if-no-files-found: error

  deploy-pages:
    name: Deploy xo-web to Cloudflare Pages
    if: >-
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: web
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download tested xo-web artifact
        uses: actions/download-artifact@v8
        with:
          name: xo-web
          path: pages-artifact

      - name: Extract static PWA
        run: |
          mkdir pages-dist
          tar -xzf pages-artifact/xo-web.tar.gz -C pages-dist
          test -f pages-dist/index.html
          test -f pages-dist/_headers
          test -f pages-dist/version.json

      - name: Validate Cloudflare Pages configuration
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT}" ]]; then
            echo 'Set the CLOUDFLARE_PAGES_PROJECT repository variable.' >&2
            exit 1
          fi

      - name: Deploy tested artifact
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy pages-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Smoke-test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "${DEPLOYMENT_URL}"
          curl --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "${DEPLOYMENT_URL}/healthz" | grep -Fx 'ok'
          curl --fail --show-error --silent --head \
            "${DEPLOYMENT_URL}/version.json" | grep -i '^cache-control:.*no-store'

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: xo-x86_64-unknown-linux-gnu.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: xo-aarch64-unknown-linux-gnu.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            package: xo-aarch64-apple-darwin.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: xo-x86_64-pc-windows-msvc.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Verify embedded release version
        shell: bash
        run: |
          extension=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extension=".exe"
          fi
          for binary in xo xo-admin xo-lsp xo-syncd; do
            "target/${{ matrix.target }}/release/${binary}${extension}" --version | grep -F "${XO_VERSION}"
          done

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xo dist/
          cp target/${{ matrix.target }}/release/xo-admin dist/
          cp target/${{ matrix.target }}/release/xo-lsp dist/
          cp target/${{ matrix.target }}/release/xo-syncd dist/
          tar -C dist -czf "xo-${{ matrix.target }}.tar.gz" \
            xo xo-admin xo-lsp xo-syncd

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/xo.exe dist/
          Copy-Item target/${{ matrix.target }}/release/xo-admin.exe dist/
          Copy-Item target/${{ matrix.target }}/release/xo-lsp.exe dist/
          Copy-Item target/${{ matrix.target }}/release/xo-syncd.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "xo-${{ matrix.target }}.zip"

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: xo-${{ matrix.target }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  container:
    name: xo-syncd container
    needs:
      - quality
      - binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: xo-*-unknown-linux-gnu
          path: container-binaries

      - name: Prepare container binaries
        shell: bash
        run: |
          mkdir -p container-dist/amd64 container-dist/arm64
          tar -xzf container-binaries/xo-x86_64-unknown-linux-gnu/xo-x86_64-unknown-linux-gnu.tar.gz \
            -C container-dist/amd64 xo-syncd
          tar -xzf container-binaries/xo-aarch64-unknown-linux-gnu/xo-aarch64-unknown-linux-gnu.tar.gz \
            -C container-dist/arm64 xo-syncd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=xo-syncd
            org.opencontainers.image.description=Always-on synchronization peer for xo workspaces

      - name: Build and publish xo-syncd image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-container:
    name: xo-web container
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/xo-web
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=xo-web
            org.opencontainers.image.description=Static offline-first xo PWA

      - name: Build and publish xo-web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.xo-web
          target: xo-web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            XO_VERSION=${{ env.XO_VERSION }}
          cache-from: type=gha,scope=xo-web
          cache-to: type=gha,mode=max,scope=xo-web

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate timestamp release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "release tag must be a UTC timestamp such as 20260731T171136Z" >&2
            exit 1
          fi

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: xo-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum xo-* > SHA256SUMS

      - name: Create tagged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it unchanged."
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
