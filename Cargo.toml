[workspace]
resolver = "2"
members = [
    "crates/xo-core",
    "crates/xo",
    "crates/xo-admin",
    "crates/xo-lsp",
    "crates/xo-syncd",
    "crates/xo-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gnur/exokephalos"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = "1.12.1"
ciborium = "0.2.2"
clap = { version = "4.5.41", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dom_smoothie = "0.18.0"
futures-lite = "2.6.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
iroh = "=0.98.0"
iroh-blobs = "=0.100.0"
iroh-docs = "=0.98.0"
iroh-gossip = "=0.98.0"
notify = "=8.2.0"
quick_html2md = { version = "0.2.1", features = ["url"] }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
ratatui = "0.30.2"
rpassword = "7.4.0"
regex = "1.11.1"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serde_yaml = "0.9.34"
steel-core = "=0.8.2"
subtle = "2.6.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1.46.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-lsp = "0.20.0"
url = "2.5.4"
wasm-bindgen = "0.2.105"
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
