[workspace]
resolver = "2"
members = [
    "crates/xo-core",
    "crates/xo",
    "crates/xo-admin",
    "crates/xo-lsp",
    "crates/xo-syncd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gnur/exokephalos"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.2"
ciborium = "0.2.2"
clap = { version = "4.5.41", features = ["derive"] }
futures-lite = "2.6.1"
iroh = "=0.98.0"
iroh-blobs = "=0.100.0"
iroh-docs = "=0.98.0"
iroh-gossip = "=0.98.0"
rand = "0.9.2"
regex = "1.11.1"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
steel-core = "=0.8.2"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
