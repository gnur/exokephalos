[package]
name = "xo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = [
    "dep:aes-gcm",
    "dep:argon2",
    "dep:base64",
    "dep:notify",
    "dep:regex",
    "dep:rusqlite",
    "dep:tempfile",
    "dep:zeroize",
]
peer-protocol = ["dep:base64", "dep:iroh"]
iroh-sync = [
    "native",
    "peer-protocol",
    "dep:futures-lite",
    "dep:hostname",
    "dep:iroh-gossip",
    "dep:tokio",
]
steel = ["dep:steel-core"]
test-utils = ["iroh-sync", "iroh/test-utils"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
anyhow.workspace = true
argon2 = { workspace = true, optional = true }
automerge.workspace = true
base64 = { workspace = true, optional = true }
blake3.workspace = true
ciborium.workspace = true
ed25519-dalek.workspace = true
futures-lite = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
rand.workspace = true
regex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
steel-core = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# Enables the in-process TLS relay fixture for Iroh synchronization tests.
iroh = { workspace = true, features = ["test-utils"] }
